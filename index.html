    <style>
    /* Özkar Mermer Özel Tasarım */
    .ozkar-silim-container {
        background: #ffffff;
        padding: 60px 25px;
        max-width: 1000px;
        margin: 40px auto;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        border-top: 5px solid #1a1a1a;
    }

    .ozkar-logo-baslik {
        font-family: 'Times New Roman', serif;
        color: #1a1a1a;
        font-size: 2.8rem;
        text-align: center;
        margin: 0;
        letter-spacing: 4px;
    }

    .hizmet-alt-baslik {
        color: #b08d57;
        font-size: 1.2rem;
        text-align: center;
        margin-top: 5px;
        font-weight: 300;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .ozkar-ayrac {
        width: 120px;
        height: 2px;
        background: linear-gradient(to right, transparent, #b08d57, transparent);
        margin: 20px auto 40px;
    }

    .ozkar-metin-alani p {
        text-align: center;
        color: #555;
        font-size: 1.15rem;
        line-height: 1.8;
        margin-bottom: 40px;
    }

    .ozkar-ozellikler {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 25px;
        margin-bottom: 40px;
    }

    .ozkar-madde {
        background: #fdfdfd;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #f0f0f0;
        display: flex;
        align-items: flex-start;
        transition: 0.3s;
    }

    .ozkar-madde:hover {
        background: #fff;
        box-shadow: 0 5px 15px rgba(176, 141, 87, 0.15);
        border-color: #b08d57;
    }

    .ozkar-ikon {
        font-size: 1.8rem;
        margin-right: 15px;
    }

    .ozkar-madde-metin {
        color: #444;
        font-size: 0.95rem;
        line-height: 1.5;
    }

    .ozkar-madde-metin strong {
        display: block;
        color: #1a1a1a;
        margin-bottom: 5px;
        font-size: 1.1rem;
    }

    .ozkar-slogan {
        text-align: center;
        font-size: 1.3rem;
        font-style: italic;
        color: #b08d57;
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid #eee;
        font-weight: 500;
    }

    @media (max-width: 768px) {
        .ozkar-logo-baslik { font-size: 2rem; }
    }
</style>
