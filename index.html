    <meta charset="UTF-8">

    <title>Özkar Mermer | İzmir Mermer Silim ve Parlatma Hizmetleri</title>
    <link rel="canonical" href="https://harunozdemir3504-create.github.io/mermersilimozkargithub/" />
    <meta name="description" content="Mermer, traverten ve granit yüzeyleriniz için profesyonel silim, parlatma ve bakım hizmetleri. Özkar Mermer ile zeminlerinizi ilk günkü parlaklığına kavuşturun.">
    <meta name="keywords" content="izmir mermer silim, mermer parlatma izmir, mermer temizleme, özkar mermer, mermer restorasyon">
    <link rel="stylesheet" href="style.css">
    
    <style>
    /* --- NAVBAR VE ORTALANMIŞ RENKLİ LOGO STİLLERİ --- */
    .navbar {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between;
        align-items: center;
        position: relative;
        padding: 15px 20px;
    }

    .dropdown-menu-container {
        position: relative;
        display: inline-block;
        flex: 1;
    }

    .menu-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        color: #d4af37;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.08);
        padding: 8px 12px;
        border-radius: 4px;
        transition: background 0.3s;
        width: fit-content;
        white-space: nowrap;
    }

    .menu-toggle:hover {
        background: rgba(255, 255, 255, 0.15);
    }

    .dropdown-content {
        display: none;
        position: absolute;
        top: 120%;
        left: 0;
        background-color: #1a1a1a;
        min-width: 280px;
        max-height: 400px;
        overflow-y: auto;
        box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
        border-radius: 5px;
        z-index: 1001;
        border: 1px solid #333;
    }

    .dropdown-content::-webkit-scrollbar {
        width: 6px;
    }
    .dropdown-content::-webkit-scrollbar-thumb {
        background: #d4af37;
        border-radius: 3px;
    }

    .dropdown-content a {
        color: #fff;
        padding: 10px 15px;
        text-decoration: none;
        display: block;
        font-size: 13.5px;
        transition: background 0.3s, color 0.3s;
        border-bottom: 1px solid #2a2a2a;
    }

    .dropdown-content a:hover {
        background-color: #d4af37;
        color: #000;
    }

    .show {
        display: block;
    }

    /* Tam Ortalı ve Renkli Logo Stili */
    .logo { 
        font-size: 32px !important;
        font-weight: 800;
        color: #ffffff; 
        text-align: center;
        flex: 1;
        display: flex;
        justify-content: center;
        text-decoration: none;
        white-space: nowrap;
    }

    .logo span {
        color: #d4af37;
        margin-left: 4px;
    }

    .menu { 
        display: flex !important;
        flex-direction: row !important;
        gap: 15px;
        align-items: center;
        flex: 1;
        justify-content: flex-end;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .menu a {
        color: #fff;
        text-decoration: none;
        font-size: 15px;
    }

    /* --- MÜKEMMEL MOBİL UYUM (768px Altı) --- */
    @media (max-width: 768px) {
        .navbar {
            flex-direction: column !important;
            align-items: center !important;
            gap: 12px;
            padding: 15px 10px;
        }
        .dropdown-menu-container {
            width: 100%;
            display: flex;
            justify-content: center;
            flex: none;
        }
        .menu-toggle {
            width: 100%;
            justify-content: center;
        }
        .logo {
            flex: none;
            font-size: 28px !important;
        }
        .menu {
            justify-content: center;
            width: 100%;
            gap: 12px;
            flex-wrap: wrap;
            flex: none;
        }
        .menu a {
            font-size: 14px;
        }
        .mermer-kiyaslama-kutusu {
            max-width: 92% !important;
            margin: 0 auto 30px auto;
        }
        .resim-sonrasi {
            height: 260px !important;
        }
    }

    /* --- ÖNCESİ / SONRASI KIYASLAMA KUTUSU --- */
    .mermer-kiyaslama-kutusu {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto 35px auto;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      overflow: hidden;
      background: #000;
    }

    .resim-sonrasi {
      display: block;
      width: 100%;
      height: 480px;
      object-fit: cover;
    }

    .resim-oncesi {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }

      position: absolute;
      top: 15px;
      padding: 5px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 4px;

      letter-spacing: 1px;
      pointer-events: none;

    }

      left: 15px;
      background-color: rgba(220, 53, 69, 0.85);
      color: #fff;
